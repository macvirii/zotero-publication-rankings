name: Semgrep CE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  semgrep:
    name: Semgrep CE scan
    runs-on: [linux-x64, dotnet, node]
    steps:
      - uses: actions/checkout@v4
      - name: Install Semgrep
        run: |
          python3 -m venv "$RUNNER_TEMP/semgrep"
          "$RUNNER_TEMP/semgrep/bin/pip" install --disable-pip-version-check semgrep==1.168.0
      - name: Scan
        run: $RUNNER_TEMP/semgrep/bin/semgrep scan --config auto --error .
