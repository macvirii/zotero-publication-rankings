name: Semgrep CE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  semgrep:
    name: Semgrep CE scan
    runs-on: [linux-x64, dotnet, node]
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.168.0 semgrep scan --config auto --error .
