name: SonarQube

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sonar:
    name: SonarQube analysis
    runs-on: [linux-x64, dotnet, node]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan
        uses: SonarSource/sonarqube-scan-action@v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
